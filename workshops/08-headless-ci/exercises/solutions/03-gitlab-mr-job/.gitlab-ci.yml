# Production-ready .gitlab-ci.yml for AI-review on MR
# Required CI/CD variables:
#   - ANTHROPIC_API_KEY (masked, protected)
#   - GITLAB_ACCESS_TOKEN (masked, protected) — Project Access Token, scope: api

stages:
  - ai

claude-review:
  stage: ai
  image: node:24-alpine3.21
  timeout: 10 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "50"
  before_script:
    - apk add --no-cache git curl bash jq
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"
    - claude --version
    - claude auth status || (echo "AUTH FAILED — check ANTHROPIC_API_KEY"; exit 1)
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD > diff.patch
    - DIFF_LINES=$(wc -l < diff.patch)
    - echo "Diff size - $DIFF_LINES lines"
    - if [ "$DIFF_LINES" -lt 5 ]; then echo "Diff too small, skipping review"; exit 0; fi
    - >
      cat diff.patch | claude -p
      --bare
      --permission-mode plan
      --output-format json
      --max-turns 3
      --max-budget-usd 1.00
      --no-session-persistence
      --append-system-prompt-file ./prompt.md
      > review.json
    - jq -r '.result' review.json | tee review.txt
    - echo "Cost - \$$(jq -r '.total_cost_usd' review.json)"
  artifacts:
    paths:
      - review.json
      - review.txt
    expire_in: 1 week
  after_script:
    - |
      if [ -n "${GITLAB_ACCESS_TOKEN:-}" ] && [ -f review.txt ]; then
        review_text=$(cat review.txt)
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_ACCESS_TOKEN" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$review_text" '{body: ("**Claude Code review:**\n\n" + $body)}')" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" \
          > /dev/null
        echo "Posted review to MR !$CI_MERGE_REQUEST_IID"
      else
        echo "Skipping MR comment (no GITLAB_ACCESS_TOKEN or no review)"
      fi
