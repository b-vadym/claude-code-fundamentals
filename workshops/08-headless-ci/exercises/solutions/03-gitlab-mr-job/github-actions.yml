# Equivalent for GitHub Actions — drop into .github/workflows/claude-review.yml
# Required secret: ANTHROPIC_API_KEY

name: Claude Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Option A: official action (recommended)
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this pull request for bugs, security issues, and style problems. Post findings as review comments."
          claude_args: "--max-turns 5 --max-budget-usd 1.00"

      # Option B: raw CLI (uncomment if you want full control)
